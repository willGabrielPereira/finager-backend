services:
  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finager_api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/finager?sslmode=disable
      SEED_TAGS_ONLY: "true"
      SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - finager_net

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: finager_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finager
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finager_net

  # ─── Mailpit (SMTP fake para dev — UI em http://localhost:8025) ────────────
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: finager_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - finager_net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pg_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  finager_net:
    driver: bridge
